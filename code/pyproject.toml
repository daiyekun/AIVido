[project]
name = "ainew"
version = "1.0.0"
description = "EcomCraft AI content generation platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.13",
    "celery==5.6.3",
    "amqp==5.4.1",
    "kombu==5.6.2",
    "redis==8.1.0",
    "minio==7.2.20",
    "pillow==11.3.0",
    "httpx==0.28.1",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-celery==0.66b1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis==2.39.0",
]
